version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: pcis-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pcis
    volumes:
      - pcis_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pcis_mongo_data:
    driver: local
